<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1222">
<title>QUICKTAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2fb;--surface:#fff;--line:#e1ddf0;--text:#14142b;--muted:#6b6985;
  --accent:#5b45f0;--on-accent:#fff;--wait:#e5484d;--go:#12b76a;--warn:#f08a24;--on-state:#fff;
  --shadow:0 10px 30px rgba(60,40,140,.12);
  box-sizing:border-box;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1222;--surface:#181c33;--line:#272c4d;--text:#f2f1ff;--muted:#9a9cc0;
    --accent:#8b7bff;--on-accent:#0f1222;--wait:#d93a4a;--go:#19c37d;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1222;--surface:#181c33;--line:#272c4d;--text:#f2f1ff;--muted:#9a9cc0;
  --accent:#8b7bff;--on-accent:#0f1222;--wait:#d93a4a;--go:#19c37d;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 22px;text-align:center}
.screen.on{display:flex;animation:in .4s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* theme toggle */
#theme{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--surface);
  box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
#theme svg{width:20px;height:20px;fill:var(--text)}

/* home */
.mark{width:92px;height:92px;border-radius:50%;border:6px solid var(--accent);display:grid;place-items:center;margin-bottom:26px;position:relative}
.mark::before{content:"";width:34px;height:34px;border-radius:50%;background:var(--go);animation:beat 2.2s ease-in-out infinite}
.mark::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.2s ease-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
h1{margin:0;font-size:clamp(46px,16vw,76px);font-weight:800;letter-spacing:-.04em;line-height:.95}
.tag{margin:14px 0 0;color:var(--muted);font-size:18px;line-height:1.4;max-width:300px}
.best{margin:30px 0 8px;padding:12px 22px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:15px;color:var(--muted)}
.best b{color:var(--text);font-size:18px;margin-left:6px}
.btn{display:block;width:100%;max-width:320px;min-height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);
  font-size:20px;font-weight:700;box-shadow:0 12px 26px -8px var(--accent);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none;border:1.5px solid var(--line);min-height:52px;font-size:17px;margin-top:12px}
.how{margin:22px 0 0;font-size:14px;color:var(--muted);max-width:280px;line-height:1.5}

/* game stage */
#game{padding:0;max-width:none;background:var(--wait);color:var(--on-state);transition:background .15s;cursor:pointer}
#game.go{background:var(--go)}
#game.false{background:var(--warn)}
#app{max-width:none}
.stage-inner{max-width:420px;padding:0 28px;display:flex;flex-direction:column;align-items:center}
.round{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0;font-size:16px;font-weight:600;opacity:.9}
.dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.d{background:#fff}
.dots i.c{background:#fff;transform:scale(1.35)}
.big{font-size:clamp(44px,15vw,84px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.sub{margin:14px 0 0;font-size:19px;opacity:.9;line-height:1.4}
#game.go .big{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
#game:not(.go):not(.false) .big{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7}}

/* result */
.ms{font-size:clamp(70px,24vw,120px);font-weight:800;letter-spacing:-.05em;line-height:1;margin:0;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ms small{font-size:.32em;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.verdict{margin:10px 0 26px;font-size:20px;font-weight:600;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
.chip{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.now{border-color:var(--accent);color:var(--text)}
#next{pointer-events:none;opacity:.5;transition:opacity .2s}
#next.ready{pointer-events:auto;opacity:1}

/* final */
.avg-label{color:var(--muted);font-size:16px;margin:0 0 4px}
.badge{margin:12px 0 0;padding:7px 14px;border-radius:999px;background:var(--go);color:#fff;font-size:15px;font-weight:700;animation:pop .4s .2s both}
.list{list-style:none;padding:0;margin:26px 0 28px;width:100%;max-width:320px}
.list li{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);font-size:17px;font-variant-numeric:tabular-nums}
.list li span:first-child{color:var(--muted)}
.list li.fast span:last-child{color:var(--go);font-weight:700}
@media (max-height:640px){.mark{margin-bottom:14px;width:72px;height:72px}.best{margin:18px 0 6px}.list{margin:14px 0 16px}.list li{padding:8px 4px}.ms{font-size:64px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <button id="theme" type="button" aria-label="Switch light or dark theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20V2z"/><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6" style="stroke:var(--text)"/></svg>
  </button>

  <section id="home" class="screen on">
    <div class="mark" aria-hidden="true"></div>
    <h1>QUICKTAP</h1>
    <p class="tag">How fast are your reflexes? Five rounds will tell.</p>
    <div class="best">Personal best<b id="bestHome">--</b></div>
    <button class="btn" id="start" type="button">Start</button>
    <p class="how">Wait for the screen to turn green, then tap as fast as you can.</p>
  </section>

  <section id="game" class="screen" aria-live="polite">
    <div class="round"><span id="roundLabel">Round 1 of 5</span><div class="dots" id="dots"></div></div>
    <div class="stage-inner">
      <p class="big" id="gBig">Wait for green</p>
      <p class="sub" id="gSub">Don’t tap yet</p>
    </div>
  </section>

  <section id="result" class="screen">
    <p class="avg-label" id="rLabel">Round 1</p>
    <p class="ms"><span id="rMs">0</span><small>ms</small></p>
    <p class="verdict" id="rVerdict"></p>
    <div class="chips" id="chips"></div>
    <button class="btn" id="next" type="button">Next round</button>
  </section>

  <section id="final" class="screen">
    <p class="avg-label">Your average</p>
    <p class="ms"><span id="fAvg">0</span><small>ms</small></p>
    <div class="badge" id="fBadge" hidden>New personal best</div>
    <ul class="list" id="fList"></ul>
    <button class="btn" id="again" type="button">Play again</button>
    <button class="btn ghost" id="toHome" type="button">Home</button>
  </section>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Config ---------- */
  var CONFIG = { rounds: 5, minDelay: 1500, maxDelay: 4500, nextLockMs: 450, bestKey: "quicktap:best", themeKey: "quicktap:theme" };

  /* ---------- Storage (safe) ---------- */
  var store = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- Helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    home: $("home"), game: $("game"), result: $("result"), final: $("final"),
    bestHome: $("bestHome"), gBig: $("gBig"), gSub: $("gSub"), roundLabel: $("roundLabel"), dots: $("dots"),
    rLabel: $("rLabel"), rMs: $("rMs"), rVerdict: $("rVerdict"), chips: $("chips"), next: $("next"),
    fAvg: $("fAvg"), fBadge: $("fBadge"), fList: $("fList")
  };
  function show(name) {
    ["home", "game", "result", "final"].forEach(function (n) { els[n].classList.toggle("on", n === name); });
  }
  function verdict(ms) {
    if (ms < 200) return "Lightning fast";
    if (ms < 250) return "Sharp";
    if (ms < 300) return "Solid";
    if (ms < 400) return "Steady";
    return "Keep practising";
  }

  /* ---------- Theme ---------- */
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); }
  applyTheme(store.get(CONFIG.themeKey));
  $("theme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    applyTheme(next); store.set(CONFIG.themeKey, next);
  });

  /* ---------- Personal best ---------- */
  function getBest() { var v = parseInt(store.get(CONFIG.bestKey), 10); return isNaN(v) ? null : v; }
  function renderBest() { var b = getBest(); els.bestHome.textContent = b === null ? "--" : b + " ms"; }

  /* ---------- Game state ---------- */
  var state = { phase: "home", round: 0, times: [], timer: null, goAt: 0 };

  function drawDots() {
    var h = "";
    for (var i = 0; i < CONFIG.rounds; i++) h += '<i class="' + (i < state.round ? "d" : i === state.round ? "c" : "") + '"></i>';
    els.dots.innerHTML = h;
  }

  function newGame() { state.round = 0; state.times = []; nextRound(); }

  function nextRound() {
    clearTimeout(state.timer);
    state.phase = "waiting";
    els.game.className = "screen on";
    els.roundLabel.textContent = "Round " + (state.round + 1) + " of " + CONFIG.rounds;
    els.gBig.textContent = "Wait for green";
    els.gSub.textContent = "Don’t tap yet";
    drawDots();
    show("game");
    els.game.classList.add("on");
    var delay = CONFIG.minDelay + Math.random() * (CONFIG.maxDelay - CONFIG.minDelay);
    state.timer = setTimeout(goSignal, delay);
  }

  function goSignal() {
    state.phase = "go";
    els.game.classList.add("go");
    els.gBig.textContent = "TAP!";
    els.gSub.textContent = "";
    state.goAt = performance.now();
  }

  function falseStart() {
    clearTimeout(state.timer);
    state.phase = "false";
    els.game.classList.add("false");
    els.gBig.textContent = "Too soon";
    els.gSub.textContent = "You tapped before green. Tap to retry this round.";
  }

  function handleTap(e) {
    if (e && e.type === "keydown" && e.code !== "Space") return;
    if (e && e.preventDefault) e.preventDefault();
    var now = performance.now();
    if (state.phase === "waiting") { falseStart(); }
    else if (state.phase === "go") { recordResult(Math.round(now - state.goAt)); }
    else if (state.phase === "false") { setTimeout(nextRound, 0); state.phase = "starting"; }
  }

  function recordResult(ms) {
    state.phase = "result";
    state.times.push(ms);
    state.round++;
    var last = state.round >= CONFIG.rounds;
    els.rLabel.textContent = "Round " + state.round + " of " + CONFIG.rounds;
    els.rMs.textContent = ms;
    els.rVerdict.textContent = verdict(ms);
    els.chips.innerHTML = state.times.map(function (t, i) {
      return '<span class="chip' + (i === state.times.length - 1 ? " now" : "") + '">R' + (i + 1) + " · " + t + "</span>";
    }).join("");
    els.next.textContent = last ? "See results" : "Next round";
    els.next.classList.remove("ready");
    show("result");
    setTimeout(function () { els.next.classList.add("ready"); }, CONFIG.nextLockMs);
  }

  function showFinal() {
    var sum = state.times.reduce(function (a, b) { return a + b; }, 0);
    var avg = Math.round(sum / state.times.length);
    var best = getBest();
    var isNew = best === null || avg < best;
    if (isNew) { store.set(CONFIG.bestKey, String(avg)); }
    var fastest = Math.min.apply(null, state.times);
    els.fAvg.textContent = avg;
    els.fBadge.hidden = !isNew;
    els.fList.innerHTML = state.times.map(function (t, i) {
      return '<li class="' + (t === fastest ? "fast" : "") + '"><span>Round ' + (i + 1) + "</span><span>" + t + " ms</span></li>";
    }).join("");
    renderBest();
    state.phase = "final";
    show("final");
  }

  /* ---------- Events ---------- */
  els.game.addEventListener("pointerdown", handleTap);
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && (state.phase === "waiting" || state.phase === "go" || state.phase === "false")) handleTap(e);
  });
  $("start").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  $("toHome").addEventListener("click", function () { state.phase = "home"; renderBest(); show("home"); });
  els.next.addEventListener("click", function () {
    if (state.round >= CONFIG.rounds) showFinal(); else nextRound();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state.phase === "waiting") nextRound();
  });

  renderBest();
})();
</script>
</body>
</html>
